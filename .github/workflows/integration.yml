name: Integration Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  integration-testbed:
    name: E2E Integration Tests
    runs-on: macos-15
    timeout-minutes: 15
    env:
      PYO3_PYTHON: /opt/homebrew/opt/python@3.12/bin/python3.12
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
      DARKBLOOM_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: coordinator/go.mod

      - name: Install Python 3.12
        run: brew install python@3.12

      - name: Install vllm-mlx
        run: /opt/homebrew/opt/python@3.12/bin/python3.12 -m pip install vllm-mlx mlx-lm

      - name: Set up Python runtime
        run: |
          rm -rf ~/.darkbloom/python
          PBS_TAG="20260408"
          PBS_PYTHON_VERSION="3.12.13"
          PBS_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/cpython-${PBS_PYTHON_VERSION}+${PBS_TAG}-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p ~/.darkbloom/python
          curl -fsSL "$PBS_URL" | tar xzf - --strip-components=1 -C ~/.darkbloom/python
          ~/.darkbloom/python/bin/pip install vllm-mlx 'mlx-lm>=0.31.2'

      - name: Build provider
        run: |
          cd provider
          cargo build --release

      - name: Run integration tests
        run: |
          go test ./testbed/integration/ -count=1 -v -timeout 10m
